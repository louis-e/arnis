[package]
name = "arnis"
version = "3.4.0"
edition = "2021"
# Cargo only auto-detects a root build.rs, so the moved path has to be declared.
build = "src/build.rs"
description = "Arnis - Generate real life cities in Minecraft"
homepage = "https://github.com/louis-e/arnis"
repository = "https://github.com/louis-e/arnis"
license = "Apache-2.0"
readme = "README.md"

[profile.release]
lto = "thin"
overflow-checks = true

[features]
default = ["gui"]
gui = ["tauri", "tauri-plugin-log", "tauri-plugin-shell", "tokio", "rfd", "tauri-build"]

[build-dependencies]
# The explicit `features = []` on tauri and tauri-build keeps `cargo tauri build` from rewriting them, which marked Linux release hashes -dirty.
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
base64 = "0.22.1"
bytes = "1"
byteorder = "1.5"
clap = { version = "4.6.0", features = ["derive", "env"] }
colored = "3.0.0"
ctrlc = { version = "3.4", features = ["termination"] }
crc = "3"
dda-voxelize = { git = "https://github.com/MIERUNE/dda-voxelize-rs", rev = "1e0844a873262f13b19a709e188a3df22a6fbf97" }
dirs = "6.0.0"
fastanvil = "0.32.0"
fastnbt = "2.6.0"
flate2 = { version = "1.1", features = ["zlib-rs"] }
fnv = "1.0.7"
fs2 = "0.4"
geo = "0.33.1"
gltf = { version = "1", default-features = false, features = ["import", "names", "utils", "KHR_materials_unlit"] }
image = "0.25"
include_dir = "0.7"
indicatif = "0.18.4"
itertools = "0.15.0"
log = "0.4.27"
mimalloc = "0.1"
once_cell = "1.21.3"
osmpbf = { version = "0.3.8", default-features = false }
rand = { version = "0.9.3", features = ["std", "std_rng"] }
rand_chacha = "0.9"
rayon = "1.10.0"
reqwest = { version = "0.13.1", features = ["blocking", "json", "query", "gzip"] }
rfd = { version = "0.17.2", optional = true }
semver = "1.0.27"
parquet = { version = "59", default-features = false, features = ["snap", "zstd"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1_smol = "1.0"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-log = { version = "2.6.0", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tokio = { version = "1.48.0", features = ["full"], optional = true }
twox-hash = { version = "=2.1.2", default-features = false, features = ["xxhash32"] }
nbtx = { git = "https://github.com/louis-e/nbtx", rev = "551c38ac74f2e68a07d3dbdd354faac0c0ac966e" }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
rusty-leveldb = { git = "https://github.com/louis-e/leveldb-rs", rev = "6cd88082d25fc3ad73c955d4ffda039ae0f28205" }
rusqlite = { version = "0.40", features = ["bundled"] }
zstd = "0.13"
quick-xml = "0.41.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.26.0"

[[example]]
name = "refresh_wikidata_index"
path = "assets/refresh_wikidata_index.rs"
