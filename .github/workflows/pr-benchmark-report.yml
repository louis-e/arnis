name: PR Benchmark Report

# Fork PRs get a read-only token, so the comment is posted from here. This workflow never runs PR code.
permissions: {}

on:
  workflow_run:
    workflows: [PR Benchmark]
    types: [completed]
  issue_comment:
    types: [created]

jobs:
  comment:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Read result and format summary
        id: comment_body
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Runs from before this split upload no result.
          if ! gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n benchmark-result -D result; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The file was written by PR code, so accept only well-formed values.
          field() { grep -m1 -E "^$1=$2\$" result/benchmark.txt | cut -d= -f2; }
          pr=$(field pr '[0-9]+')
          sha=$(field sha '[0-9a-f]{40}')
          duration=$(field duration '[0-9]+')
          gen_time=$(field gen_time '[0-9]*')
          peak_mem=$(field peak_memory '[0-9]+')
          if [ -z "$pr" ] || [ -z "$duration" ] || [ -z "$peak_mem" ] || [ "$sha" != "$HEAD_SHA" ]; then
            echo "::error::Malformed benchmark result"; exit 1
          fi
          # Also stops a result being posted on another PR, and skips stale results after a push.
          if [ "$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)" != "$sha" ]; then
            echo "PR #$pr no longer points at $sha, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

          minutes=$((duration / 60))
          seconds=$((duration % 60))

          baseline_time=48
          diff=$((duration - baseline_time))
          abs_diff=${diff#-}

          # Use generation-only time for the verdict and reported delta when available,
          # so the two stay consistent instead of mixing wall-clock and generation-only time.
          if [ -n "$gen_time" ]; then
            eval_diff=$((gen_time - baseline_time))
            diff=$eval_diff
            abs_diff=${diff#-}
          else
            eval_diff=$diff
          fi
          eval_abs_diff=${eval_diff#-}

          if [ "$eval_diff" -le -5 ]; then
            verdict="✅ This PR **improves generation time**."
          elif [ "$eval_abs_diff" -le 4 ]; then
            verdict="🟢 Generation time is unchanged."
          elif [ "$eval_diff" -le 10 ]; then
            verdict="⚠️ This PR **worsens generation time**."
          else
            verdict="🚨 This PR **drastically worsens generation time**."
          fi

          baseline_mem=1250
          mem_diff=$((peak_mem - baseline_mem))
          mem_abs_diff=${mem_diff#-}
          mem_annotation=""
          if [ "$mem_abs_diff" -gt 30 ]; then
            mem_percent=$((mem_diff * 100 / baseline_mem))
            mem_abs_percent=${mem_percent#-}
            if [ "$mem_diff" -gt 0 ]; then
              mem_annotation=" (↗ ${mem_abs_percent}% more)"
            else
              mem_annotation=" (↘ ${mem_abs_percent}% less)"
            fi
          fi

          if [ "$mem_diff" -lt -100 ]; then
            mem_verdict="✅ This PR **drastically reduces peak memory**."
          elif [ "$mem_diff" -lt -30 ]; then
            mem_verdict="🌱 This PR **reduces peak memory**."
          elif [ "$mem_abs_diff" -le 30 ]; then
            mem_verdict="🟢 Peak memory is unchanged."
          elif [ "$mem_diff" -le 200 ]; then
            mem_verdict="⚠️ This PR **increases peak memory**."
          else
            mem_verdict="🚨 This PR **drastically increases peak memory**."
          fi

          benchmark_time=$(date -u "+%Y-%m-%d %H:%M:%S UTC")

          {
            echo "summary<<EOF"
            echo "⏱️ Benchmark run finished in **${minutes}m ${seconds}s**"
            if [ -n "$gen_time" ]; then
              echo "🏗️ Generation time: **${gen_time}s** (excl. data fetching)"
            fi
            echo "🧠 Peak memory usage: **${peak_mem} MB**${mem_annotation}"
            echo ""
            echo "📈 Compared against baseline: **${baseline_time}s** time, **${baseline_mem} MB** memory"
            echo "🧮 Delta: **${diff}s** time, **${mem_diff} MB** memory"
            echo "🔢 Commit: [\`${sha:0:7}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${sha})"
            echo ""
            echo "${verdict}"
            echo "${mem_verdict}"
            echo ""
            echo "📅 **Last benchmark:** ${benchmark_time}"
            echo ""
            echo "_You can retrigger the benchmark by commenting \`retrigger-benchmark\`._"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment benchmark result on PR
        if: steps.comment_body.outputs.skip != 'true'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: ${{ steps.comment_body.outputs.summary }}
          comment-tag: benchmark-report
          pr-number: ${{ steps.comment_body.outputs.pr }}

  retrigger:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'retrigger-benchmark')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      # Re-run the PR's own benchmark run, so PR code keeps its read-only token.
      - name: Re-run the benchmark for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          sha=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefOid -q .headRefOid)
          run=$(gh run list -R "$GITHUB_REPOSITORY" -w pr-benchmark.yml -e pull_request -c "$sha" -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::No benchmark run for $sha yet. Push a commit or reopen the PR."; exit 1
          fi
          gh run rerun "$run" -R "$GITHUB_REPOSITORY"
