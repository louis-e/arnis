name: PR Benchmark

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  benchmark:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'retrigger-benchmark'))
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number || github.event.issue.number) || github.ref }}

      - name: Create dummy Minecraft world directory
        shell: bash
        run: mkdir -p "./world/region"

      - name: Build for release
        run: cargo build --release --no-default-features

      - name: Run benchmark (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          start=$(date +%s)
          ./target/release/arnis --path="./world" --mode=geo-terrain --benchmark --bbox="48.125768 11.552296 48.148565 11.593838" 2> benchmark_log.txt
          duration=$(($(date +%s) - start))
          echo "duration=${duration}" >> $GITHUB_OUTPUT
          echo "os_label=${{ matrix.os }}" >> $GITHUB_OUTPUT

      - name: Run benchmark (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $start = Get-Date
          ./target/release/arnis.exe --path="./world" --mode=geo-terrain --benchmark --bbox="48.125768 11.552296 48.148565 11.593838" 2> benchmark_log.txt
          $duration = [math]::Round(((Get-Date) - $start).TotalSeconds)
          echo "duration=$duration" >> $env:GITHUB_OUTPUT
          echo "os_label=windows-latest" >> $env:GITHUB_OUTPUT
