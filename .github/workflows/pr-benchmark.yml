name: PR Benchmark

# Runs PR code with a read-only token; pr-benchmark-report.yml posts the result from main.
permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup-arnis-linux
        with:
          gui-deps: "false"

      - name: Create dummy Minecraft world directory
        run: |
          mkdir -p "./world/region"

      - name: Build for release
        run: cargo build --release --no-default-features

      - name: Start timer
        id: start_time
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Run benchmark command with memory tracking
        id: benchmark
        run: |
          /usr/bin/time -v ./target/release/arnis --path="./world" --mode=geo-terrain --benchmark --bbox="48.114370 11.531525 48.159963 11.614609" 2> benchmark_log.txt
          grep "Maximum resident set size" benchmark_log.txt | awk '{print $6}' > peak_mem_kb.txt
          peak_kb=$(cat peak_mem_kb.txt)
          peak_mb=$((peak_kb / 1024))
          echo "peak_memory=${peak_mb}" >> $GITHUB_OUTPUT
          gen_time_ms=$(grep -oP '(?<=generation_time_ms=)\d+' benchmark_log.txt || echo "")
          gen_time=""
          if [ -n "$gen_time_ms" ]; then
            gen_time=$(( (gen_time_ms + 500) / 1000 ))
          fi
          echo "gen_time=${gen_time}" >> $GITHUB_OUTPUT

      - name: End timer and calculate duration
        id: end_time
        run: |
          end_time=$(date +%s)
          start_time=${{ steps.start_time.outputs.start_time }}
          duration=$((end_time - start_time))
          echo "duration=$duration" >> $GITHUB_OUTPUT

      - name: Save result
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DURATION: ${{ steps.end_time.outputs.duration }}
          GEN_TIME: ${{ steps.benchmark.outputs.gen_time }}
          PEAK_MEMORY: ${{ steps.benchmark.outputs.peak_memory }}
        run: |
          mkdir -p result
          printf 'pr=%s\nsha=%s\nduration=%s\ngen_time=%s\npeak_memory=%s\n' \
            "$PR_NUMBER" "$COMMIT_SHA" "$DURATION" "$GEN_TIME" "$PEAK_MEMORY" > result/benchmark.txt
          echo "Generation time: ${GEN_TIME:-?}s, peak memory: ${PEAK_MEMORY} MB, total: ${DURATION}s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: benchmark-result
          path: result/benchmark.txt
          retention-days: 7
