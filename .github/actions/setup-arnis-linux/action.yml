name: Set up Arnis build environment
description: Install Rust toolchain, optionally install GTK/WebKit GUI libs (Linux only), restore cargo cache. Caller must check out the repo first.

inputs:
  rust-components:
    description: Extra rustup components (e.g. "clippy,rustfmt")
    required: false
    default: ""
  rust-targets:
    description: Extra rustup targets (e.g. "x86_64-pc-windows-msvc")
    required: false
    default: ""
  gui-deps:
    description: Install GTK/WebKit system libs needed by the gui feature (Linux only)
    required: false
    default: "true"
  cache:
    description: Restore the Swatinem/rust-cache for cargo registry + target
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: ${{ inputs.rust-components }}
        targets: ${{ inputs.rust-targets }}

    - name: Install Linux GUI dependencies
      if: runner.os == 'Linux' && inputs.gui-deps == 'true'
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # Hosted runners prefer azure.archive.ubuntu.com, which intermittently blackholes; bound each fetch so a sick mirror fails fast instead of hanging the job for hours.
        printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
        # timeout runs under sudo so it signals apt directly rather than just the sudo wrapper.
        apt_retry() { for i in 1 2 3; do sudo -E timeout 600 "$@" && return 0; echo "::warning::apt attempt $i failed, retrying in 15s"; sleep 15; done; return 1; }
        apt_retry apt-get update
        apt_retry apt-get install -y software-properties-common
        sudo add-apt-repository -y universe
        echo "deb http://archive.ubuntu.com/ubuntu $(lsb_release -sc)-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
        apt_retry apt-get update
        apt_retry apt-get install -y libgtk-3-dev build-essential pkg-config libglib2.0-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev
        echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu/pkgconfig" >> $GITHUB_ENV

    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@v2
