<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arnis - Stream Mode</title>
  <!-- English-only on purpose: stream mode is a prototype, and the shared
       locale files are key-set checked against en-US by a test in gui.rs. -->
  <link rel="stylesheet" href="./css/stream.css" />
  <script src="./js/stream.js" defer></script>
</head>

<body data-state="waiting">
  <main class="stream">
    <!-- The whole point of this window: a red radar ping readable from across
         the room while Minecraft is in the foreground. -->
    <div class="live" aria-hidden="true">
      <span class="ring"></span>
      <span class="ring ring-delayed"></span>
      <span class="dot"></span>
    </div>

    <h1 class="title">Stream Mode Active</h1>
    <p class="address" id="stream-address" dir="ltr">127.0.0.1</p>
    <p class="client" id="stream-client">Waiting for Minecraft to connect...</p>
    <p class="counters" id="stream-counters">0 chunks &middot; 0 tiles &middot; 0% cache hits</p>
    <p class="hint">Closing this window stops stream mode.</p>
  </main>
</body>

</html>
